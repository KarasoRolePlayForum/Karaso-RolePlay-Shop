
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karaso.roleplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.karaso.roleplay'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Karaso-RolePlay.apk"
        }
    }
}
