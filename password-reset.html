<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARASO | بازیابی رمز عبور</title><link rel="stylesheet" href="./style.css"></head>
<body class="reset-page"><main class="reset-card"><small>KARASO ROLEPLAY / ACCOUNT SECURITY</small><h1>تعیین رمز عبور جدید</h1><p>پس از باز کردن لینک بازیابی که به ایمیلت ارسال شده، رمز جدیدت را وارد کن.</p><form id="resetForm"><label>رمز عبور جدید<input type="password" id="newPassword" minlength="6" autocomplete="new-password" required></label><label>تکرار رمز عبور<input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required></label><button class="cta full" type="submit" id="savePassword">ثبت رمز جدید</button><p id="resetMessage" class="form-error"></p></form><a class="secondary full reset-back" href="./index.html">بازگشت به صفحه اصلی</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=window.supabase.createClient(window.KARASO_SUPABASE_URL,window.KARASO_SUPABASE_PUBLISHABLE_KEY,window.KARASO_SUPABASE_AUTH_OPTIONS);const form=document.getElementById('resetForm'),msg=document.getElementById('resetMessage'),btn=document.getElementById('savePassword');let recovery=false;
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)recovery=true});
(async()=>{const {data,error}=await sb.auth.getSession();if(error)msg.textContent=error.message;else if(data.session)recovery=true;})();
form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<6){msg.textContent='رمز عبور باید حداقل ۶ کاراکتر باشد.';return}if(a!==b){msg.textContent='تکرار رمز عبور با رمز جدید یکسان نیست.';return}btn.disabled=true;msg.textContent='';const {error}=await sb.auth.updateUser({password:a});btn.disabled=false;if(error){msg.textContent='خطا: '+error.message+' — لینک بازیابی ممکن است منقضی شده باشد.';return}msg.textContent='رمز عبور با موفقیت تغییر کرد. اکنون می‌توانی وارد حساب شوی.';form.reset();};
</script></body></html>
